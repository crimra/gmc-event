<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace organisateur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page-wrap">
    <div class="app-shell">
      <div class="hero admin">
        <div class="hero-top">
          <div class="logo-badge admin">
            <img src="/static/img/logo-gmc.png" alt="Organisateur">
          </div>
          <div class="pill-badge">Espace organisateur</div>
          <div class="admin-title">Accès réservé</div>
          <div class="admin-desc">Entre le mot de passe organisateur pour gérer les photos de l'événement.</div>
        </div>

        <div class="auth-card admin">
          {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}
          <form method="post" action="/admin/auth">
            <label class="field-label on-dark" for="password">Mot de passe organisateur</label>
            <input class="input-pass on-dark" type="password" id="password" name="password" placeholder="••••••••" autofocus required style="margin: 6px 0 14px;">
            <button class="btn-gold admin" type="submit">Ouvrir l'espace admin</button>
          </form>
        </div>

        <div class="hero-footer">
          <a class="link-muted" href="/">Retour à la galerie invité</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
